<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Screen Share Privacy Guard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Privacy Guard</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track" aria-hidden="true"></span>
        <span class="visually-hidden">Hide sensitive info</span>
      </label>
    </header>
    <p class="status" id="status"></p>

    <fieldset id="types">
      <legend>Hide on every page</legend>
      <label><input type="checkbox" data-type="email" /> Email addresses</label>
      <label><input type="checkbox" data-type="phone" /> Phone numbers</label>
      <label><input type="checkbox" data-type="card" /> Card numbers</label>
    </fieldset>

    <p class="hint">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd> turns hiding on or off.</p>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
