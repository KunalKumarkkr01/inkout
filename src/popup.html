<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inkout</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-state="on">
    <header class="top">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#FFFFFF" stroke="#0F1B2D" stroke-width="3" />
          <rect x="11" y="11" width="26" height="5" rx="2.5" fill="#B8C1CC" />
          <path d="M12 25 L36 23" fill="none" stroke="#0F1B2D" stroke-width="8" stroke-linecap="round" />
          <rect x="11" y="32" width="16" height="5" rx="2.5" fill="#B8C1CC" />
        </svg>
        <span class="brand-name">Inkout</span>
      </div>
      <button type="button" id="settings" class="icon-button" aria-label="Open settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
      </button>
    </header>

    <div id="sharing-banner" class="banner" role="status" hidden>
      <span class="banner-dot" aria-hidden="true"></span>
      <span class="banner-text">
        <span class="banner-title">You are sharing your screen</span>
        <span id="sharing-label" class="banner-label"></span>
      </span>
    </div>

    <section class="state-card">
      <button type="button" id="power" class="power" aria-pressed="true" aria-label="Turn protection on or off">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>
        <span id="power-word" class="power-word">ON</span>
      </button>
      <div class="state-text">
        <h1 id="state-title" class="state-title">Protection is on</h1>
        <p id="state-desc" class="state-desc"></p>
      </div>
    </section>

    <section class="site-card">
      <div class="site">
        <span id="site-initial" class="site-initial" aria-hidden="true"></span>
        <span class="site-text">
          <span id="site-host" class="site-host"></span>
          <span id="site-line" class="site-line"></span>
        </span>
      </div>
      <div id="counts" class="counts"></div>
      <button type="button" id="pause" class="secondary-button">Pause on this site</button>
    </section>

    <button type="button" id="blur-page" class="blur-page" hidden>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10 10 0 0 1 6.1 6.1" /><path d="M2 12s3.6-7 10-7c1.9 0 3.6.6 5 1.5" /><path d="M22 12s-1.2 2.4-3.6 4.5" /><line x1="2" y1="2" x2="22" y2="22" /></svg>
      <span class="blur-text">
        <span class="blur-title">Blur the whole page</span>
        <span class="blur-hint">For surprises. Press Alt + Shift + K</span>
      </span>
    </button>

    <footer class="bottom">
      <span class="shortcut"><kbd>Alt</kbd><kbd>Shift</kbd><kbd>H</kbd> to toggle</span>
      <span class="local">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
        Collects nothing
      </span>
    </footer>

    <script src="settings.js"></script>
    <script src="sites.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
