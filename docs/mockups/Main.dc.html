<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popup A — Calm switch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7A75}a:hover{color:#085E5A}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F4F6F8; font-family: Manrope, system-ui, sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px 18px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#FFFFFF" stroke="#0F1B2D" stroke-width="3"></rect>
        <rect x="11" y="11" width="26" height="5" rx="2.5" fill="#B8C1CC"></rect>
        <path d="M12 25 L36 23" fill="none" stroke="#0F1B2D" stroke-width="8" stroke-linecap="round"></path>
        <rect x="11" y="32" width="16" height="5" rx="2.5" fill="#B8C1CC"></rect>
      </svg>
      <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.01em">Inkout</span>
    </div>
    <button type="button" aria-label="Open settings" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #5B6573; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </div>

  <div style="margin: 0 16px; background: {{cardBg}}; border-radius: 20px; padding: 26px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 1px 2px rgba(15,27,45,0.06)">
    <button type="button" aria-pressed="{{pressed}}" aria-label="Turn protection on or off" onClick="{{toggle}}" style="width: 136px; height: 136px; border-radius: 50%; border: 10px solid {{ring}}; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; box-shadow: 0 0 0 8px {{halo}}">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{ring}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <span style="font-size: 20px; font-weight: 800; color: {{ring}}; letter-spacing: 0.04em">{{stateWord}}</span>
    </button>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.01em">{{title}}</div>
      <div style="font-size: 14px; line-height: 1.45; color: #4A5462; max-width: 270px">{{desc}}</div>
    </div>
  </div>

  <div style="margin: 12px 16px 0; background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(15,27,45,0.06)">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #E8EEF5; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: #33435A">M</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 700">mail.google.com</div>
        <div style="font-size: 13px; color: #4A5462">{{siteLine}}</div>
      </div>
    </div>
    <sc-if value="{{isOn}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="font-size: 12px; font-weight: 700; color: #0B5E5A; background: #E3F4F2; border-radius: 999px; padding: 5px 10px">9 emails</span>
        <span style="font-size: 12px; font-weight: 700; color: #0B5E5A; background: #E3F4F2; border-radius: 999px; padding: 5px 10px">3 phones</span>
        <span style="font-size: 12px; font-weight: 700; color: #0B5E5A; background: #E3F4F2; border-radius: 999px; padding: 5px 10px">2 cards</span>
      </div>
    </sc-if>
    <button type="button" style="height: 44px; border: 1px solid #D5DBE2; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #0F1B2D; cursor: pointer">Pause on this site</button>
  </div>

  <div style="margin-top: auto; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #4A5462">
    <div style="display: flex; align-items: center; gap: 4px">
      <kbd style="font-family: Manrope, sans-serif; font-size: 11px; font-weight: 700; border: 1px solid #CDD4DC; border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: #FFFFFF">Alt</kbd>
      <kbd style="font-family: Manrope, sans-serif; font-size: 11px; font-weight: 700; border: 1px solid #CDD4DC; border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: #FFFFFF">Shift</kbd>
      <kbd style="font-family: Manrope, sans-serif; font-size: 11px; font-weight: 700; border: 1px solid #CDD4DC; border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: #FFFFFF">H</kbd>
      <span style="margin-left: 2px">to toggle</span>
    </div>
    <div style="display: flex; align-items: center; gap: 5px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <span>Stays on your device</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true };
  }
  renderVals() {
    const on = this.state.on;
    return {
      isOn: on,
      pressed: on ? 'true' : 'false',
      toggle: () => this.setState({ on: !this.state.on }),
      ring: on ? '#0B7A75' : '#B45309',
      halo: on ? '#E3F4F2' : '#FDEBD3',
      cardBg: on ? '#FFFFFF' : '#FFF7EC',
      stateWord: on ? 'ON' : 'OFF',
      title: on ? 'Protection is on' : 'Protection is off',
      desc: on
        ? 'Emails, phone numbers and card numbers are blurred on every site.'
        : 'Everything is visible to anyone watching your screen.',
      siteLine: on ? '14 items hidden on this tab' : 'Nothing hidden right now',
    };
  }
}
</script>
</body>
</html>
