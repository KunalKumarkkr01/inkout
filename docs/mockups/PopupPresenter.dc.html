<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popup C — Presenter mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5EDDD3}a:hover{color:#8BE9E1}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #0F1B2D; font-family: Manrope, system-ui, sans-serif; color: #E8EEF5; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px 18px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#FFFFFF" stroke="#0F1B2D" stroke-width="3"></rect>
        <rect x="11" y="11" width="26" height="5" rx="2.5" fill="#B8C1CC"></rect>
        <path d="M12 25 L36 23" fill="none" stroke="#0F1B2D" stroke-width="8" stroke-linecap="round"></path>
        <rect x="11" y="32" width="16" height="5" rx="2.5" fill="#B8C1CC"></rect>
      </svg>
      <span style="font-size: 16px; font-weight: 800">Inkout</span>
    </div>
    <button type="button" aria-label="Open settings" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #9AA8B8; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="6" r="2" fill="#0F1B2D"></circle><circle cx="15" cy="12" r="2" fill="#0F1B2D"></circle><circle cx="8" cy="18" r="2" fill="#0F1B2D"></circle></svg>
    </button>
  </div>

  <div style="margin: 4px 16px 0; padding: 14px 16px; border-radius: 16px; background: #123B3A; border: 1px solid #1E5C59; display: flex; gap: 12px; align-items: flex-start">
    <span style="margin-top: 5px; width: 10px; height: 10px; border-radius: 50%; background: #3CC9BF; box-shadow: 0 0 0 5px rgba(60,201,191,0.22); flex: none; display: block"></span>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 15px; font-weight: 800">You are sharing your screen</span>
      <span style="font-size: 13px; line-height: 1.4; color: #B9E9E4">Google Meet · protection switched on automatically 4 min ago</span>
    </div>
  </div>

  <button type="button" style="margin: 14px 16px 0; min-height: 72px; border: 0; border-radius: 16px; background: #F5A524; color: #1F1300; font: inherit; display: flex; align-items: center; gap: 14px; padding: 12px 16px; text-align: left; cursor: pointer">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10 10 0 0 1 6.1 6.1"></path><path d="M2 12s3.6-7 10-7c1.9 0 3.6.6 5 1.5"></path><path d="M22 12s-1.2 2.4-3.6 4.5"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 800">Blur the whole page</span>
      <span style="font-size: 12px; font-weight: 600; color: #4A3200">For surprises. Press Alt + Shift + B</span>
    </span>
  </button>

  <div style="padding: 18px 18px 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9AA8B8">Hidden while presenting</div>
  <div style="margin: 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{hidden}}" as="item" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #17263B; font-size: 13px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5EDDD3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>{{item}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin: 14px 16px 0; border-radius: 14px; background: #17263B; display: flex; flex-direction: column">
    <sc-for list="{{rules}}" as="rule" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 4px 14px; min-height: 48px">
        <span style="font-size: 13px; font-weight: 600">{{rule.label}}</span>
        <button type="button" aria-pressed="{{rule.pressed}}" aria-label="{{rule.label}}" style="width: 52px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <span style="width: 40px; height: 24px; border-radius: 999px; background: {{rule.track}}; position: relative; display: block"><span style="position: absolute; top: 3px; left: {{rule.knob}}; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; display: block"></span></span>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 12px 18px; font-size: 12px; color: #9AA8B8">Detects sharing in Meet, Teams and Zoom on the web.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const rules = [
      { label: 'Turn on when I start sharing', on: true },
      { label: 'Turn off when sharing ends', on: false },
    ];
    return {
      hidden: ['Emails, phones, cards', 'Tab titles', 'Text fields', 'Custom words'],
      rules: rules.map((rule) => ({
        ...rule,
        pressed: rule.on ? 'true' : 'false',
        track: rule.on ? '#1FA39A' : '#46566B',
        knob: rule.on ? '19px' : '3px',
      })),
    };
  }
}
</script>
</body>
</html>
