name: Release

# Push a tag such as v1.0.1 (matching manifest.json) to release that version. One-time setup and
# the full steps: docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the tag matches manifest.json
        run: node scripts/publish.js check-tag "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run package
      - name: Create the GitHub release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "dist/inkout-${GITHUB_REF_NAME#v}.zip"
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Inkout ${GITHUB_REF_NAME#v}"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Waits for your approval (Settings → Environments → chrome-web-store).
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write # lets Google check that this run comes from this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download the zip from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'inkout-*.zip' --dir dist
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload to the Chrome Web Store and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/publish.js submit "dist/inkout-${GITHUB_REF_NAME#v}.zip"
